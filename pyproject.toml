[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "track-distance"
version = "0.2.1"
description = "Measure distances between UK railway stations along the track (Network Rail track model), not as the crow flies."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Dillon Rose", email = "dillonrose0@icloud.com" }]
keywords = ["distance", "rail-distance", "track-distance", "network-rail", "railway", "uk-rail", "gis", "shortest-path", "routing", "geopandas", "great-britain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["geopandas>=0.14", "networkx>=3.0", "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "shapely>=2.0"]

[project.optional-dependencies]
# Interactive HTML maps go through geopandas .explore(), which needs folium.
map = ["folium>=0.15", "mapclassify>=2.6", "matplotlib>=3.8"]
dev = ["track-distance[map]", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-networkx", "scipy-stubs", "types-shapely", "types-geopandas"]

[project.scripts]
track-distance = "track_distance.cli:main"

[project.urls]
Homepage = "https://github.com/rosedillon/track-distance"
Documentation = "https://github.com/rosedillon/track-distance#readme"
Source = "https://github.com/rosedillon/track-distance"
Issues = "https://github.com/rosedillon/track-distance/issues"
Changelog = "https://github.com/rosedillon/track-distance/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# PEP 8: code may run to 99 when agreed, but comments and docstrings
# still wrap at 72.
max-doc-length = 72

[tool.mypy]
strict = true
